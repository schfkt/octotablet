pre-commit:
  piped: true
  jobs:
    - name: fmt
      run: cargo fmt --all -- --check
    - name: clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - name: tests
      run: cargo test --all-features --locked
    - name: tests-no-backend
      run: cargo test --lib --no-default-features --locked
